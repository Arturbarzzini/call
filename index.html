<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Звонок...</title>
  <script>
    var phone = window.location.search.replace(/[^0-9]/g, "");
    if (phone) {
      window.location.href = "tel:+" + phone;
    }
  </script>
</head>
<body>
  <p style="font-family: sans-serif; font-size: 20px; text-align: center; margin-top: 50px;">
    Переход к звонку... <br><br>
    <a id="btn" href="#" style="padding: 15px 25px; background: #28a745; color: white; text-decoration: none; border-radius: 8px;">Нажать для вызова</a>
  </p>
  <script>
    if (phone) {
      document.getElementById("btn").href = "tel:+" + phone;
    }
  </script>
</body>
</html>
